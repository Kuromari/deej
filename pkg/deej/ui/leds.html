<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deej – LED colors</title>
<style>
  :root {
    --text: #e8eaee; --muted: #9ba3b0; --card: #2b2e35; --border: #474c57;
    --accent: #6aa5ff; --ok: #3ecf5a; --warn: #f0b13a; --bad: #ff6b5b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: linear-gradient(#0a1a38 0%, #14396b 48%, #1d4a24 49%, #123517 100%) fixed; }
  body { margin: 0; padding: 22px 18px 64px; color: var(--text);
         font: 12px/1.45 Tahoma, "Segoe UI", Verdana, sans-serif; }
  main { max-width: none; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: minmax(320px, 520px) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  /* windows: blue for LEDs, olive green for the configuration */
  .win { --frame: #0a3a9e; --t1: #3b78e7; --t2: #0b3fae; --t3: #082c86; --body: #1e2330; --btn: #5b8df0; --btn2: #2e5fd0;
         padding: 0 3px 3px; background: var(--frame); border-radius: 9px 9px 3px 3px; box-shadow: 0 8px 22px rgba(0,0,0,.55); }
  .win.cfg { --frame: #4a5d23; --t1: #8aa653; --t2: #5f7a2b; --t3: #46591f; --body: #23271f; --btn: #a3bd6c; --btn2: #6a8830; }
  .titlebar { display: flex; align-items: center; gap: 8px; margin: 0 -3px; padding: 4px 6px 4px 10px; min-height: 30px;
              border-radius: 9px 9px 0 0; color: #fff; font-weight: bold; font-size: 13px; text-shadow: 1px 1px 1px rgba(0,0,0,.65);
              background: linear-gradient(var(--t1), var(--t2) 14%, var(--t2) 70%, var(--t3)); }
  .titlebar .ttl { flex: 1; }
  .btns { display: flex; gap: 2px; }
  .btns i { width: 21px; height: 21px; display: grid; place-items: center; font-style: normal; font-size: 11px;
            border: 1px solid #fff; border-radius: 3px; background: linear-gradient(var(--btn), var(--btn2)); }
  .btns i.cl { background: linear-gradient(#ea8a6c, #c2431f); }
  .winbody { background: var(--body); padding: 10px; border: 1px solid rgba(0,0,0,.55); }

  /* group boxes */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px;
          box-shadow: inset 1px 1px 0 rgba(255,255,255,.06); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: bold; color: #8fb8ff; }
  .win.cfg .title { color: #bfd88a; }
  .sub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow { flex: 1; min-width: 0; }
  .bar { height: 16px; border-radius: 3px; margin: 10px 0; border: 2px solid #12141a; box-shadow: 0 0 0 1px var(--border); }

  /* controls */
  input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid #0c0d10; border-radius: 3px; background: none; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: #3a8bff; }
  button, select { font: inherit; color: var(--text); cursor: pointer; padding: 3px 10px;
                   background: linear-gradient(#4d525c, #353840); border: 1px solid #0c0d10; border-radius: 3px;
                   box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  button:hover, select:hover { box-shadow: inset 0 0 0 1px #f5c264; }
  button:active { background: linear-gradient(#2c2f36, #3a3e47); }
  button.icon { padding: 3px 8px; }
  .stop { display: inline-flex; align-items: center; gap: 2px; }
  .stop .x, .chip .x { border: none; background: none; box-shadow: none; color: var(--muted); padding: 0 4px; }
  .stop .x:hover, .chip .x:hover { color: var(--bad); box-shadow: none; }
  .tools { margin-top: 2px; }
  .txt { width: 100%; margin-top: 6px; font: inherit; color: var(--text); background: #14161a; padding: 4px 8px;
         border: 1px solid #0c0d10; border-radius: 3px; box-shadow: inset 1px 1px 3px rgba(0,0,0,.7); }

  /* configuration window */
  .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; align-items: start; }
  .side .card { margin-bottom: 0; max-height: 420px; overflow: auto; }
  .item { padding: 5px 0; border-top: 1px solid var(--border); margin-top: 5px; }
  .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name.special { color: var(--accent); } .name.device { color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 3px; background: #2f66d6; color: #fff; }
  .tag.on { background: #2e8b3a; }
  .chip { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 3px; background: #1d2026;
          padding: 1px 4px 1px 8px; font-size: 11px; }

  .sub.grp { margin-top: 10px; font-weight: bold; color: var(--accent); }
  .win.cfg .sub.grp { color: #bfd88a; }

  /* taskbar: start button, status, connection in the tray */
  .taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 14px; color: #fff;
             background: linear-gradient(#3168d5, #4993e6 3%, #2157d7 8%, #245bdb 50%, #2663e0 90%, #1941a5);
             box-shadow: 0 -1px 0 #0b2f86; text-shadow: 1px 1px 1px rgba(0,0,0,.5); }
  .start { align-self: stretch; display: flex; align-items: center; padding: 0 24px 0 14px; border-radius: 0 14px 14px 0;
           font: italic bold 17px "Trebuchet MS", Tahoma, sans-serif; box-shadow: 2px 0 4px rgba(0,0,0,.45);
           background: linear-gradient(#63c163, #3a9a3a 15%, #2e8a2e 80%, #267026); }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: #ffd6cf; font-weight: bold; }
  .pill { font-size: 11px; white-space: nowrap; }
  .pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #9ba3b0; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .pill.ok::before { background: #5dff7a; } .pill.warn::before { background: #ffd24a; } .pill.bad::before { background: #ff6b5b; }
  .taskbar .pill { align-self: stretch; display: flex; align-items: center; padding: 0 16px; border-left: 1px solid #0b2f86;
                   background: linear-gradient(#0f8ee8, #1a9cf0 12%, #0b78d6 90%); }
</style>
</head>
<body>
<main>
  <div class="layout">
    <section class="win leds">
      <div class="titlebar"><span class="ttl">LED colors</span><span class="btns" aria-hidden="true"><i>_</i><i>▫</i><i class="cl">✕</i></span></div>
      <div class="winbody">
        <div class="card">
          <div class="row"><span class="title grow">Brightness</span><span id="brightLabel" class="sub"></span></div>
          <input id="brightness" type="range" min="0" max="100" step="1">
        </div>
        <div id="sliders"></div>
      </div>
    </section>

    <section class="win cfg">
      <div class="titlebar"><span class="ttl">Audio &amp; devices</span><span class="btns" aria-hidden="true"><i>_</i><i>▫</i><i class="cl">✕</i></span></div>
      <div class="winbody"><aside class="side" id="editor"></aside></div>
    </section>
  </div>

  <div class="taskbar">
    <span class="start">deej</span>
    <span id="status"></span>
    <span id="conn" class="pill">…</span>
  </div>
</main>

<script>
(function () {
  "use strict";

  var TOKEN = "__DEEJ_TOKEN__";
  var MAX_STOPS = 4;
  var PRESETS = {
    "Sunset": ["#ff5f6d", "#ffc371"],
    "Ocean":           ["#00c6ff", "#0072ff"],
    "Fire":           ["#ff0000", "#ff8800", "#ffee00"],
    "Forest":            ["#134e5e", "#71b280"],
    "Neon":            ["#ff00cc", "#3333ff"],
    "Rainbow":      ["#ff0000", "#ffee00", "#00ff66", "#0066ff"],
    "White":            ["#ffffff"]
  };

  var state = null;          // last state from the server
  var previewTimer = null;   // throttles live preview
  var saveTimer = null;      // debounces persisting
  var statusEl = document.getElementById("status");

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({ "X-Deej-Token": TOKEN }, options.headers || {});
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { throw new Error(body.error || ("HTTP " + res.status)); }
        return body;
      });
    });
  }

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.className = isError ? "err" : "";
  }

  // ---- sending -----------------------------------------------------------

  function send(save) {
    return api("/api/leds?save=" + (save ? "1" : "0"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state.settings)
    }).then(function () {
      if (save) { setStatus("Saved ✓"); }
    }).catch(function (err) { setStatus(err.message, true); });
  }

  // called after every edit: live preview (throttled), save once things settle
  function changed() {
    setStatus("");
    if (!previewTimer) {
      previewTimer = setTimeout(function () { previewTimer = null; send(false); }, 60);
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { send(true); }, 700);
  }

  // ---- rendering ---------------------------------------------------------

  function gradientCSS(stops) {
    return stops.length === 1 ? stops[0] : "linear-gradient(90deg, " + stops.join(", ") + ")";
  }

  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") { node.textContent = props[k]; }
      else if (k === "class") { node.className = props[k]; }
      else if (k.indexOf("on") === 0) { node.addEventListener(k.slice(2), props[k]); }
      else { node.setAttribute(k, props[k]); }
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function renderCard(i) {
    var slider = state.settings.sliders[i];
    var label = state.labels[i] || "";
    var bar = el("div", { class: "bar" });
    var card = el("div", { class: "card" });

    function paintBar() { bar.style.background = gradientCSS(slider.stops); }

    function rebuild() {
      var fresh = renderCard(i);
      card.replaceWith(fresh);
    }

    var stopsRow = el("div", { class: "row" });
    slider.stops.forEach(function (color, k) {
      var picker = el("input", { type: "color", value: color, title: "Color " + (k + 1) });
      picker.addEventListener("input", function () {
        slider.stops[k] = picker.value;
        paintBar();
        changed();
      });

      var stop = el("span", { class: "stop" }, [picker]);
      if (slider.stops.length > 1) {
        stop.appendChild(el("button", {
          class: "x", title: "Remove color", text: "✕",
          onclick: function () { slider.stops.splice(k, 1); changed(); rebuild(); }
        }));
      }
      stopsRow.appendChild(stop);
    });

    var tools = el("div", { class: "row tools" });

    if (slider.stops.length < MAX_STOPS) {
      tools.appendChild(el("button", {
        class: "icon", title: "Add color (gradient)", text: "＋",
        onclick: function () { slider.stops.push(slider.stops[slider.stops.length - 1]); changed(); rebuild(); }
      }));
    }

    if (slider.stops.length > 1) {
      tools.appendChild(el("button", {
        class: "icon", title: "Reverse direction", text: "⇄",
        onclick: function () { slider.stops.reverse(); changed(); rebuild(); }
      }));
    }

    var presetSelect = el("select", { title: "Preset" }, [el("option", { value: "", text: "Preset…" })]);
    Object.keys(PRESETS).forEach(function (name) {
      presetSelect.appendChild(el("option", { value: name, text: name }));
    });
    presetSelect.addEventListener("change", function () {
      if (!presetSelect.value) { return; }
      slider.stops = PRESETS[presetSelect.value].slice();
      changed();
      rebuild();
    });
    tools.appendChild(presetSelect);

    tools.appendChild(el("button", {
      text: "Apply to all",
      title: "Use these colors for all sliders",
      onclick: function () {
        state.settings.sliders.forEach(function (s) { s.stops = slider.stops.slice(); });
        changed();
        render();
      }
    }));

    card.appendChild(el("div", { class: "row" }, [
      el("span", { class: "title", text: "Slider " + (i + 1) }),
      el("span", { class: "sub grow", text: label })
    ]));
    card.appendChild(bar);
    card.appendChild(stopsRow);
    card.appendChild(tools);
    paintBar();

    return card;
  }

  function render() {
    var container = document.getElementById("sliders");
    container.textContent = "";
    for (var i = 0; i < state.numSliders; i++) {
      container.appendChild(renderCard(i));
    }
  }

  function renderConnection() {
    var pill = document.getElementById("conn");
    if (!state.connected) {
      pill.textContent = "Board not connected"; pill.className = "pill bad";
    } else if (!state.boardReady) {
      pill.textContent = "Board not responding (sketch without LED support?)"; pill.className = "pill warn";
    } else {
      pill.textContent = "Board connected"; pill.className = "pill ok";
    }
  }

  // ---- brightness --------------------------------------------------------

  var brightness = document.getElementById("brightness");
  var brightLabel = document.getElementById("brightLabel");

  function showBrightness() {
    brightness.value = Math.round(state.settings.brightness / 255 * 100);
    brightLabel.textContent = brightness.value + " %";
  }

  brightness.addEventListener("input", function () {
    state.settings.brightness = Math.round(brightness.value / 100 * 255);
    brightLabel.textContent = brightness.value + " %";
    changed();
  });

  // ---- editor: sessions, slider assignment, COM ports --------------------

  var mapping = [], sessions = [], ports = [], mapSaveTimer = null, lastSig = "";
  var editor = document.getElementById("editor");

  // same idea as path.Match on the Go side (only * and ? are shown as wildcards here)
  function globMatch(pattern, key) {
    var re = new RegExp("^" + pattern.toLowerCase().replace(/[.+^${}()|[\]\\]/g, "\\$&")
      .replace(/\*/g, ".*").replace(/\?/g, ".") + "$");
    return re.test(key.toLowerCase());
  }

  function slidersFor(key) {
    var out = [];
    mapping.forEach(function (targets, i) {
      if (targets.some(function (t) { return globMatch(t, key); })) { out.push(i); }
    });
    return out;
  }

  function saveMapping() {
    clearTimeout(mapSaveTimer);
    mapSaveTimer = setTimeout(function () {
      api("/api/mapping", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sliders: mapping })
      }).then(function () { setStatus("Assignment saved ✓"); })
        .catch(function (err) { setStatus(err.message, true); });
    }, 400);
  }

  function assign(i, target) {
    target = target.trim();
    if (!target || mapping[i].some(function (t) { return t.toLowerCase() === target.toLowerCase(); })) { return; }
    mapping[i].push(target);
    saveMapping();
    renderEditor();
  }

  function unassign(i, target) {
    mapping[i] = mapping[i].filter(function (t) { return t !== target; });
    saveMapping();
    renderEditor();
  }

  function section(title, tools) {
    var c = el("div", { class: "card" });
    c.appendChild(el("div", { class: "row" }, [el("span", { class: "title grow", text: title })].concat(tools || [])));
    editor.appendChild(c);
    return c;
  }

  function renderEditor() {
    var n = state.numSliders;
    editor.textContent = "";

    var box = section("Audio sessions", [el("button", {
      class: "icon", title: "Rescan sessions", text: "⟳", onclick: function () { pollEditor(true); }
    })]);
    var all = sessions.concat([{ key: "deej.current", kind: "special" }, { key: "deej.unmapped", kind: "special" }]);
    [["Programs", "app"], ["deej functions", "special"], ["Devices", "device"]].forEach(function (g) {
    var items = all.filter(function (x) { return x.kind === g[1]; });
    if (!items.length) { return; }
    box.appendChild(el("div", { class: "sub grp", text: g[0] }));
    items.forEach(function (x) {
      var tags = slidersFor(x.key).map(function (i) { return el("span", { class: "tag", text: "S" + (i + 1) }); });
      var pick = el("select", { title: "Assign to slider" }, [el("option", { value: "", text: "Assign…" })]);
      for (var i = 0; i < n; i++) { pick.appendChild(el("option", { value: String(i), text: "Slider " + (i + 1) })); }
      pick.addEventListener("change", function () { if (pick.value !== "") { assign(Number(pick.value), x.key); } });
      box.appendChild(el("div", { class: "row item" },
        [el("span", { class: "grow name " + x.kind, title: x.key, text: x.key })].concat(tags, [pick])));
    });
    });

    var assigned = section("Slider assignment");
    mapping.forEach(function (targets, i) {
      var input = el("input", { type: "text", class: "txt", placeholder: "name or pattern, e.g. valorant*" });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") { assign(i, input.value); } });
      var chips = targets.map(function (t) {
        return el("span", { class: "chip" }, [el("span", { text: t }),
          el("button", { class: "x", title: "Remove", text: "✕", onclick: function () { unassign(i, t); } })]);
      });
      assigned.appendChild(el("div", { class: "item" },
        [el("div", { class: "row" }, [el("b", { text: "Slider " + (i + 1) })].concat(chips)), input]));
    });

    var com = section("COM ports");
    if (!ports.length) { com.appendChild(el("div", { class: "sub", text: "No COM ports found." })); }
    ports.forEach(function (p) {
      var row = [el("div", { class: "grow" }, [el("div", { class: "name", text: p.name }), el("div", { class: "sub", text: p.desc || "" })])];
      if (p.active) { row.push(el("span", { class: "tag on", text: "selected" })); }
      else { row.push(el("button", { title: "Use this port", text: "Use", onclick: function () { selectPort(p.name); } })); }
      com.appendChild(el("div", { class: "row item" }, row));
    });
  }

  var selectedPort = null; // keeps the choice visible until the reloaded config reports it

  function selectPort(name) {
    api("/api/port", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    }).then(function () {
      selectedPort = name;
      ports.forEach(function (p) { p.active = p.name === name; });
      setStatus("COM port saved ✓ deej reconnects");
      renderEditor();
    }).catch(function (err) { setStatus(err.message, true); });
  }

  function pollEditor(rescan) {
    return Promise.all([api("/api/sessions" + (rescan === true ? "?refresh=1" : "")), api("/api/ports")]).then(function (r) {
      var sig = JSON.stringify(r);
      sessions = r[0]; ports = r[1];
      if (selectedPort) {
        if (ports.some(function (p) { return p.active && p.name === selectedPort; })) { selectedPort = null; }
        else { ports.forEach(function (p) { p.active = p.name === selectedPort; }); }
      }
      // don't rebuild while the user is typing or has a dropdown open
      if (sig !== lastSig && (rescan === true || !editor.contains(document.activeElement))) {
        lastSig = sig;
        renderEditor();
      }
    }).catch(function (err) {
      if (!lastSig) {
        editor.textContent = "";
        section("Editor").appendChild(el("div", { class: "sub", text: "Not available: " + err.message }));
      }
    });
  }

  function initEditor() {
    api("/api/mapping").then(function (m) {
      mapping = m.sliders || [];
      while (mapping.length < state.numSliders) { mapping.push([]); }
      return pollEditor();
    }).then(function () { setInterval(pollEditor, 5000); })
      .catch(function (err) { setStatus("Editor: " + err.message, true); });
  }

  // ---- init --------------------------------------------------------------

  function refreshConnectionOnly() {
    api("/api/state").then(function (s) {
      state.connected = s.connected;
      state.boardReady = s.boardReady;
      renderConnection();
    }).catch(function () {
      document.getElementById("conn").textContent = "deej unreachable";
      document.getElementById("conn").className = "pill bad";
    });
  }

  api("/api/state").then(function (s) {
    state = s;
    renderConnection();
    showBrightness();
    render();
    // only poll the status afterwards, so we never overwrite what's being edited
    setInterval(refreshConnectionOnly, 3000);
    initEditor();
  }).catch(function (err) {
    setStatus("Could not load settings: " + err.message, true);
  });
})();
</script>
</body>
</html>
